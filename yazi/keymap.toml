[mgr]
 prepend_keymap = [
   #{ on = "<S-Enter>", run = "open",               desc = "Open with default app" },
   { on = "!", run = 'shell "$SHELL" --block', desc = "Open shell here" },
   { on = "<Enter>", run = "enter", desc = "Enter child directory" },
   { on = "<S-Enter>",   run = "open --interactive", desc = "Open with menu" },
   { on = "o", run = "open --interactive", desc = "Open with menu" },
 ]

