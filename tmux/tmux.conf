# ── General ────────────────────────────────────────────────────────────────
# Turn on mouse support: click to pick a pane, drag borders to resize, scroll
set -g mouse on

# ── Shortcuts (press Ctrl-b first, then the key) ───────────────────────────
# Easier-to-remember split keys (new panes open in the current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
 
# Close the current pane right away (x still closes it after asking y/n)
bind X kill-pane

# ── Status bar ─────────────────────────────────────────────────────────────
# Three-line status bar: line 0 stays the normal one, lines 1-2 show hints
set -g status 3

# Tab list on line 0: the tab you're in gets a dark highlighted block with a ▶,
# other tabs stay plain. "(N tabs)" on the right shows how many there are.
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=yellow bg=colour236 bold] ▶ #I:#W "
set -g window-status-separator ""
set -g status-right "(#{session_windows} tabs) \"#{=21:pane_title}\" %H:%M %d-%b-%y"
set -g status-right-length 60

# better keymap handling
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g allow-passthrough on

# Building blocks for the hint line.
# Keys look like light "keycaps" so they pop out from the dark bar;
# each section label has its own colour so groups are easy to tell apart.
%hidden BAR="colour235"
%hidden KEY="#[fg=colour16 bg=colour252 bold]"
%hidden TXT="#[fg=colour255 bg=colour235 nobold]"
%hidden DIM="#[fg=colour242 bg=colour235 nobold]"
%hidden GAP="#[fg=colour240 bg=colour235 nobold]    ┃    "

%hidden PANES="#[fg=colour16 bg=colour75 bold] PANES ${TXT}  ${KEY} | ${TXT} split →   ${KEY} - ${TXT} split ↓   ${KEY} ←↑↓→ ${TXT} move   ${KEY} z ${TXT} zoom   ${KEY} x ${TXT} close   ${KEY} X ${TXT} close now"
%hidden TABS="#[fg=colour16 bg=colour114 bold] TABS ${TXT}  ${KEY} c ${TXT} new   ${KEY} n ${DIM}/${KEY} p ${TXT} next/prev   ${KEY} w ${TXT} list   ${KEY} #, ${TXT} rename   ${KEY} & ${TXT} kill"
%hidden SESSION="#[fg=colour16 bg=colour176 bold] SESSION ${TXT}  ${KEY} d ${TXT} detach   ${KEY} s ${TXT} list   ${KEY} \$ ${TXT} rename"

set -g status-format[1] "#[fill=${BAR} bg=${BAR}]#[align=centre]#{?client_prefix,${PANES},#[fg=colour248] Ctrl-b → show shortcuts }"
set -g status-format[2] "#[fill=${BAR} bg=${BAR}]#[align=centre]#{?client_prefix,${TABS}${GAP}${SESSION},}"
